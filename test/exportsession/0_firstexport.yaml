version: 1
exported_at: '2025-10-22T00:00:00.000Z'
server:
  name: 'playwright'
  spec:
    mode: 'stdio'
    command: 'npx'
    args:
      - '-y'
      - '@playwright/mcp@latest'
      - '--output-dir'
      - 'C:/Users/jenss/ONEDRI~2/Code/Test/.evidence/screenshots'
      - '--save-session'
      - '--save-trace'
      - '--browser'
      - 'chrome'
      - '--viewport-size'
      - '2400,1350'
      - '--no-sandbox'
      - '--isolated'
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
steps:
  - action: 'call playwright tool browser_navigate url="http://localhost:3002/"'
    tool: 'browser_navigate'
    args:
      url: 'http://localhost:3002/'
    keep_session_open: true
  - action: 'call playwright tool browser_type ref="e22" element="e22" text="admin"'
    tool: 'browser_type'
    args:
      ref: 'e22'
      element: 'e22'
      text: 'admin'
    keep_session_open: true
  - action: 'call playwright tool browser_type ref="e25" element="e25" text="admin123"'
    tool: 'browser_type'
    args:
      ref: 'e25'
      element: 'e25'
      text: 'admin123'
    keep_session_open: true
  - action: 'call playwright tool browser_click ref="e27" element="e27" button="left"'
    tool: 'browser_click'
    args:
      ref: 'e27'
      element: 'e27'
      button: 'left'
    keep_session_open: true
  - action: 'call playwright tool browser_snapshot'
    tool: 'browser_snapshot'
    args: {}
    keep_session_open: true

