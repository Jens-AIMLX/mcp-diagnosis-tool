<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP Diagnosis Tool</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>MCP Diagnosis Tool</h1>
      <p class="subtitle">Inspect and debug your Model Context Protocol (MCP) servers with ease.</p>
    </header>

    <main>
      <section id="config-section">
        <h2>Load MCP Configuration</h2>
        <p class="section-subtitle">Select an <code>mcp.json</code> file to diagnose every configured server in one go.</p>
        <div class="config-actions">
          <button type="button" id="load-config-btn">Load mcp.json</button>
          <span id="config-file-name" class="config-file-name">No file selected</span>
        </div>
        <input type="file" id="config-file-input" accept=".json,application/json" class="hidden" />
      </section>

      <section id="add-server-section">
        <h2>Add / Diagnose a Server</h2>
        <form id="diagnose-form">
          <div class="form-row">
            <label for="mode-select">Mode:</label>
            <select id="mode-select" name="mode">
              <option value="http">HTTP</option>
              <option value="stdio">STDIO</option>
            </select>
          </div>
          <div class="form-row" id="http-row">
            <label for="http-url">MCP HTTP URL:</label>
            <input
              type="text"
              id="http-url"
              name="url"
              placeholder="e.g. http://localhost:3000/mcp"
            />
          </div>
          <div class="form-row hidden" id="stdio-row">
            <label for="stdio-command">Command:</label>
            <input
              type="text"
              id="stdio-command"
              name="command"
              placeholder="e.g. node build/index.js --flag value"
            />
          </div>
          <div class="form-row">
            <button type="submit">Diagnose</button>
          </div>
        </form>
      </section>

      <section id="servers-section">
        <h2>Known MCP Servers</h2>
        <div id="servers-list"></div>
      </section>
    </main>

    <template id="server-template">
      <div class="server-card">
        <div class="server-header">
          <span class="status-dot"></span>
          <div class="server-info">
            <span class="server-name"></span>
            <span class="server-meta"></span>
          </div>
          <button class="toggle-details" title="Toggle details">▶</button>
        </div>
        <div class="server-summary"></div>
        <div class="server-details hidden"></div>
      </div>
    </template>

    <script src="script.js"></script>
  </body>
</html>
